apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def hasReleaseSigningConfig = keystorePropertiesFile.exists()
def distributionChannel = (project.findProperty("distributionChannel") ?: "play").toString()
def isDemoDistribution = distributionChannel.equalsIgnoreCase("demo")

// Debug builds use Google's public AdMob test IDs. Release builds use Gravity Runner production IDs.
def admobDebugApplicationId = "ca-app-pub-3940256099942544~3347511713"
def admobDebugBannerId = "ca-app-pub-3940256099942544/9214589741"
def admobDebugInterstitialId = "ca-app-pub-3940256099942544/1033173712"
def admobDebugRewardedId = "ca-app-pub-3940256099942544/5224354917"
def admobReleaseApplicationId = "ca-app-pub-7088647938932607~1834052926"
def admobReleaseBannerId = "ca-app-pub-7088647938932607/1361764263"
def admobReleaseInterstitialId = "ca-app-pub-7088647938932607/6996704093"
def admobReleaseRewardedId = "ca-app-pub-7088647938932607/1991789429"
def gradleProperty = { primaryName, secondaryName, defaultValue ->
    def value = project.findProperty(primaryName)
    if (value == null && secondaryName != null) {
        value = project.findProperty(secondaryName)
    }
    (value ?: defaultValue).toString()
}
def adProvider = gradleProperty("adProvider", "AD_PROVIDER", "auto")
def unityGameIdAndroid = gradleProperty("UNITY_GAME_ID_ANDROID", "unityGameIdAndroid", "800080920")
def unityRewardedPlacement = gradleProperty("UNITY_REWARDED_PLACEMENT", "unityRewardedPlacement", "Rewarded_Android")
def unityInterstitialPlacement = gradleProperty("UNITY_INTERSTITIAL_PLACEMENT", "unityInterstitialPlacement", "Interstitial_Android")
def unityBannerPlacement = gradleProperty("UNITY_BANNER_PLACEMENT", "unityBannerPlacement", "Banner_Android")
def unityAdsTestMode = gradleProperty("UNITY_ADS_TEST_MODE", "unityAdsTestMode", "false").toBoolean()
def buildConfigString = { value ->
    "\"${value.replace('\\', '\\\\').replace('\"', '\\\"')}\""
}

if (hasReleaseSigningConfig) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "fun.dmtools.gravityrunner"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "fun.dmtools.gravityrunner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.0.2"
        buildConfigField "String", "DISTRIBUTION_CHANNEL", "\"${distributionChannel}\""
        buildConfigField "boolean", "IS_DEMO_DISTRIBUTION", "${isDemoDistribution}"
        buildConfigField "String", "AD_PROVIDER", buildConfigString(adProvider)
        buildConfigField "String", "UNITY_GAME_ID_ANDROID", buildConfigString(unityGameIdAndroid)
        buildConfigField "String", "UNITY_REWARDED_PLACEMENT", buildConfigString(unityRewardedPlacement)
        buildConfigField "String", "UNITY_INTERSTITIAL_PLACEMENT", buildConfigString(unityInterstitialPlacement)
        buildConfigField "String", "UNITY_BANNER_PLACEMENT", buildConfigString(unityBannerPlacement)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [admobApplicationId: admobDebugApplicationId]
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${admobDebugBannerId}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${admobDebugInterstitialId}\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"${admobDebugRewardedId}\""
            buildConfigField "boolean", "UNITY_ADS_TEST_MODE", "true"
        }
        release {
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
            manifestPlaceholders = [admobApplicationId: admobReleaseApplicationId]
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${admobReleaseBannerId}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${admobReleaseInterstitialId}\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"${admobReleaseRewardedId}\""
            buildConfigField "boolean", "UNITY_ADS_TEST_MODE", "${unityAdsTestMode}"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.gms:play-services-ads:25.2.0"
    implementation "com.unity3d.ads:unity-ads:4.7.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation "com.android.billingclient:billing:9.0.0"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
